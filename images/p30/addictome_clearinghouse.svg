<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 530" role="img" aria-labelledby="title desc">
  <title id="title">TheAddictome data clearinghouse</title>
  <desc id="desc">Distributed data in genomics and genetics, molecular omics, phenotypes and behavior, and neurobiology feed into TheAddictome data clearinghouse. Discover, access, and connect through curated links, metadata, tools, and guidance. Research impact includes finding relevant datasets, integrating evidence, prioritizing discoveries, and generating hypotheses.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#397dab"/></marker>
    <style>
      text { font-family: Lato, Arial, sans-serif; fill: #163c4c; }
      .heading { font-size: 29px; font-weight: 700; fill: #075689; }
      .label { font-size: 25px; font-weight: 700; }
      .detail { font-size: 22px; fill: #526b77; }
      .outer { fill: none; stroke: #8fa9b6; stroke-width: 2; }
      .tile { fill: #e0e5e6; }
    </style>
  </defs>

  <rect class="outer" x="10" y="10" width="375" height="500" rx="20"/>
  <text class="heading" x="197.5" y="61" text-anchor="middle">Distributed data</text>
  <path d="M32 82 H363" stroke="#397dab" stroke-width="1.6"/>
  <g transform="translate(30 100)">
    <rect class="tile" width="335" height="86" rx="10"/>
    <text class="label" x="18" y="34">Genomics &amp; genetics</text>
    <text class="detail" x="18" y="65">DNA / GWAS / QTL</text>
  </g>
  <g transform="translate(30 202)">
    <rect class="tile" width="335" height="86" rx="10"/>
    <text class="label" x="18" y="34">Molecular omics</text>
    <text class="detail" x="18" y="65">RNA / proteins / metabolites</text>
  </g>
  <g transform="translate(30 304)">
    <rect class="tile" width="335" height="86" rx="10"/>
    <text class="label" x="18" y="34">Phenotypes &amp; behavior</text>
    <text class="detail" x="18" y="65">Drug responses / traits</text>
  </g>
  <g transform="translate(30 406)">
    <rect class="tile" width="335" height="86" rx="10"/>
    <text class="label" x="18" y="34">Neurobiology</text>
    <text class="detail" x="18" y="65">Brain regions / circuits</text>
  </g>

  <path d="M396 260 H449" fill="none" stroke="#397dab" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="465" y="20" width="475" height="480" rx="22" fill="#d3e5ef" stroke="#397dab" stroke-width="2"/>
  <text x="702.5" y="145" text-anchor="middle" style="fill:#075689;font-size:48px;font-weight:700">TheAddictome</text>
  <text x="702.5" y="205" text-anchor="middle" style="font-size:28px;font-weight:700">DATA CLEARINGHOUSE</text>
  <text x="702.5" y="280" text-anchor="middle" style="font-size:33px;font-weight:700"><tspan x="702.5">Discover · Access</tspan><tspan x="702.5" dy="43">Connect</tspan></text>
  <text x="702.5" y="399" text-anchor="middle" style="font-size:25px"><tspan x="702.5">Curate links, metadata, tools,</tspan><tspan x="702.5" dy="34">and guidance</tspan></text>
  <path d="M951 260 H1008" fill="none" stroke="#397dab" stroke-width="4" marker-end="url(#arrow)"/>

  <rect class="outer" x="1020" y="10" width="370" height="500" rx="20"/>
  <text class="heading" x="1205" y="61" text-anchor="middle">Research impact</text>
  <path d="M1042 82 H1368" stroke="#397dab" stroke-width="1.6"/>
  <g transform="translate(1040 100)">
    <rect class="tile" width="330" height="86" rx="10"/>
    <text class="label" x="18" y="34">Find relevant datasets</text>
    <text class="detail" x="18" y="65">Less time searching</text>
  </g>
  <g transform="translate(1040 202)">
    <rect class="tile" width="330" height="86" rx="10"/>
    <text class="label" x="18" y="34">Integrate evidence</text>
    <text class="detail" x="18" y="65">Across studies and species</text>
  </g>
  <g transform="translate(1040 304)">
    <rect class="tile" width="330" height="86" rx="10"/>
    <text class="label" x="18" y="34">Prioritize discoveries</text>
    <text class="detail" x="18" y="65">Genes, pathways, drug targets</text>
  </g>
  <g transform="translate(1040 406)">
    <rect class="tile" width="330" height="86" rx="10"/>
    <text class="label" x="18" y="34">Generate hypotheses</text>
    <text class="detail" x="18" y="65">Inform the next experiment</text>
  </g>
</svg>
