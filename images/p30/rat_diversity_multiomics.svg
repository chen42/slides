<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc">
  <title id="title">Genetic diversity and multi-omics in rat models of human drug addiction</title>
  <desc id="desc">Two complementary strengths, genetic diversity in rat models and multi-omics profiling of DNA epigenomics, RNA epitranscriptomics, and proteins, converge on understanding individual differences in addiction-related behavior. The flat, single-color protein helix-bundle icon is schematic, not a prediction for a specific protein.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#397dab"/></marker>
    <style>
      text { font-family: Lato, Arial, sans-serif; fill: #163c4c; }
      .heading { font-size: 32px; font-weight: 700; fill: #075689; }
      .label { font-size: 26px; }
      .outline { fill: none; stroke: #215b79; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .connector { fill: none; stroke: #397dab; stroke-width: 3; stroke-linejoin: round; }
    </style>
    <g id="rat" stroke="#163c4c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
