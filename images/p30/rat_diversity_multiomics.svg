      <ellipse cx="202" cy="46" rx="7" ry="9" fill="currentColor"/>
      <path d="M201 42 Q205 45 202 50" fill="none" stroke-width="1.5"/>
      <circle cx="231" cy="66" r="2.3" fill="#163c4c" stroke="none"/>
      <circle cx="251" cy="75" r="1.5" fill="#163c4c" stroke="none"/>
      <path d="M116 78 Q100 82 98 101 L122 101 M136 91 L136 104 L150 104 M204 85 L209 100 L227 100 M187 88 L191 102 L200 102 M244 74 L260 64 M244 78 L263 80 M244 80 L258 89" fill="none"/>
    </g>
  </defs>

  <rect x="20" y="12" width="540" height="295" rx="14" fill="#e0e5e6"/>
  <rect x="640" y="12" width="540" height="295" rx="14" fill="#d3e5ef"/>
  <text class="heading" x="290" y="68" text-anchor="middle">Genetic diversity</text>
  <text class="heading" x="910" y="68" text-anchor="middle">Multi-omics</text>
  <path d="M55 90 H525 M675 90 H1145" stroke="#397dab" stroke-width="2"/>

  <use href="#rat" transform="translate(45 135) scale(0.58)" style="color:#a2b1b7"/>
  <use href="#rat" transform="translate(210 135) scale(0.58)" style="color:#6598b7"/>
  <use href="#rat" transform="translate(375 135) scale(0.58)" style="color:#397dab"/>
  <text class="label" x="290" y="266" text-anchor="middle">Rat models</text>

  <g class="outline" transform="translate(697 116)">
    <path d="M18 0 C18 33 76 51 76 92 M76 0 C76 33 18 51 18 92 M20 8 H74 M28 25 H66 M40 42 H54 M40 51 H54 M28 68 H66 M20 85 H74"/>
  </g>
