<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">JUMP suite: tools for proteomics analysis</title>
  <desc id="desc">Six tools developed by Xusheng Wang: JUMPshiny for statistics and visualization, JUMP for peptide identification, JUMPlib for a TMT library, JUMPg for proteogenomics, SMAP for sample verification, and JUMPsem for kinase activity. Citations use first author, year, and abbreviated journal names.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#397dab"/></marker>
    <style>
      text { font-family: Lato, Arial, sans-serif; fill: #163c4c; }
      .card { fill: #d3e5ef; stroke: #9bb7c7; stroke-width: 1.3; }
      .name { font-size: 26px; font-weight: 700; }
      .function { font-size: 21px; }
      .citation { font-size: 18px; fill: #486573; }
      .journal { font-style: italic; }
      .rule { stroke: #397dab; stroke-width: 1.6; }
      .connector { fill: none; stroke: #397dab; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
  </defs>
  <g class="connector">
    <path d="M600 240 V224 H300 V179" marker-end="url(#arrow)"/>
    <path d="M600 224 V179" marker-end="url(#arrow)"/>
    <path d="M600 224 H900 V179" marker-end="url(#arrow)"/>
    <path d="M600 308 V332 H300 V379" marker-end="url(#arrow)"/>
    <path d="M600 332 V379" marker-end="url(#arrow)"/>
    <path d="M600 332 H900 V379" marker-end="url(#arrow)"/>
  </g>
  <rect x="480" y="240" width="240" height="68" rx="10" fill="#075689"/>
  <text x="600" y="283" text-anchor="middle" style="fill:#fff;font-size:28px;font-weight:700">JUMP suite</text>

  <g transform="translate(175.2 41) scale(0.8)">
    <rect class="card" width="312" height="170" rx="10"/>
    <text class="name" x="20" y="34">JUMPshiny</text>
    <path class="rule" d="M20 49 H292"/>
    <text class="function" x="20" y="78">Statistics and</text>
    <text class="function" x="20" y="103">visualization</text>
    <text class="citation" x="20" y="134">Zhang A et al., 2025</text>
    <text class="citation journal" x="20" y="155">Proteomics</text>
  </g>
  <g transform="translate(475.2 41) scale(0.8)">
    <rect class="card" width="312" height="170" rx="10"/>
    <text class="name" x="20" y="34">JUMP</text>
    <path class="rule" d="M20 49 H292"/>
    <text class="function" x="20" y="78">Peptide identification</text>
    <text class="citation" x="20" y="134">Wang X et al., 2014</text>
    <text class="citation journal" x="20" y="155">Mol Cell Proteomics</text>
  </g>
  <g transform="translate(775.2 41) scale(0.8)">
    <rect class="card" width="312" height="170" rx="10"/>
    <text class="name" x="20" y="34">JUMPlib</text>
    <path class="rule" d="M20 49 H292"/>
    <text class="function" x="20" y="78">TMT library</text>
    <text class="citation" x="20" y="113">Shen J et al., 2018</text>
    <text class="citation" x="20" y="134">Poudel S et al., 2024</text>
    <text class="citation journal" x="20" y="155">J Proteome Res</text>
  </g>
  <g transform="translate(175.2 381) scale(0.8)">
    <rect class="card" width="312" height="170" rx="10"/>
    <text class="name" x="20" y="34">JUMPg</text>
    <path class="rule" d="M20 49 H292"/>
    <text class="function" x="20" y="78">Proteogenomics</text>
    <text class="citation" x="20" y="134">Li Y et al., 2016</text>
    <text class="citation journal" x="20" y="155">J Proteome Res</text>
  </g>
  <g transform="translate(475.2 381) scale(0.8)">
    <rect class="card" width="312" height="170" rx="10"/>
    <text class="name" x="20" y="34">SMAP</text>
    <path class="rule" d="M20 49 H292"/>
    <text class="function" x="20" y="78">Sample verification</text>
  </g>
  <g transform="translate(775.2 381) scale(0.8)">
    <rect class="card" width="312" height="170" rx="10"/>
    <text class="name" x="20" y="34">JUMPsem</text>
    <path class="rule" d="M20 49 H292"/>
    <text class="function" x="20" y="78">Kinase activity</text>
  </g>
</svg>
